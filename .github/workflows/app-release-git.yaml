name: Android Release Build & GitHub Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build APK and Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Platforms
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platforms;android-30" "build-tools;36.0.0" || true

      - name: Prepare Secrets Configuration (.env)
        run: |
          if [ ! -f .env ]; then
            touch .env
            echo "GEMINI_API_KEY=" >> .env
          fi

      - name: Setup Keystore for APK Signing
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          elif [ -f ".system_secure_core_keystore/upload.jks" ]; then
            echo "Using system secure core keystore from repository..."
            cp .system_secure_core_keystore/upload.jks my-upload-key.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=Tv@Map9#Xz8!Secure_AndroidTV2026" >> $GITHUB_ENV
            echo "KEY_PASSWORD=Tv@Map9#Xz8!Secure_AndroidTV2026" >> $GITHUB_ENV
          else
            echo "Generating fallback upload key..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -sigalg SHA256withRSA \
              -validity 10000 \
              -storepass "Tv@Map9#Xz8!Secure_AndroidTV2026" \
              -keypass "Tv@Map9#Xz8!Secure_AndroidTV2026" \
              -dname "CN=android tv os apps, OU=System Secure Core, O=Android TV OS, L=Dhaka, ST=Dhaka, C=BD"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=Tv@Map9#Xz8!Secure_AndroidTV2026" >> $GITHUB_ENV
            echo "KEY_PASSWORD=Tv@Map9#Xz8!Secure_AndroidTV2026" >> $GITHUB_ENV
          fi

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Compile and Build Release APK via AGP
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify and Locate Generated Release APK
        id: find_apk
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" -not -name "*unaligned*" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::Release APK was not generated!"
            exit 1
          fi
          echo "Found release APK: $APK_FILE"
          
          OUTPUT_APK="TV-Google-Map-v1.0.0.0.apk"
          cp "$APK_FILE" "$OUTPUT_APK"
          echo "apk_path=$OUTPUT_APK" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-google-map-release-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.0.0.0-build-${{ github.run_number }}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish Direct GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: "TV Google Map ${{ steps.release_tag.outputs.tag_name }} (Version 1.0.0.0)"
          body: |
            ## 📺 TV Google Map - Android TV Edition
            
            **অ্যাপ্লিকেশন তথ্য:**
            - **অ্যাপের নাম:** TV Google Map
            - **ভার্সন নেম:** 1.0.0.0
            - **ভার্সন কোড:** 1
            - **মিনিমাম এসডিকে:** 24 (Android 7.0)
            - **টার্গেট এসডিকে:** 30 (Android 11)
            - **কম্পাইল এসডিকে:** 36 (AGP 9.1 / Jetpack Compose)
            - **টিভি কনফিগারেশন:**
              - `android.software.leanback` (required="true")
              - `android.hardware.touchscreen` (required="false")
              - ফুল রিমোট কন্ট্রোল ডি-প্যাড নেভিগেশন ও প্যান মোড
              - সার্চ অন টিভি গুগল ম্যাপ (কার্সার পড়তেই অটো কিবোর্ড ওপেন)
              - রেস্তোরাঁ, কফি, শপ, সুপারমার্কেট, শোরুম শর্টকাট
              - কারেন্ট লোকেশন টোস্ট নোটিফিকেশন
            
            **APK ডাউনলোড:**
            নিচের Assets সেকশন থেকে `${{ steps.find_apk.outputs.apk_path }}` ডাউনলোড করে আপনার টিভিতে সরাসরি ইনস্টল করতে পারেন।
          draft: false
          prerelease: false
          files: ${{ steps.find_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
